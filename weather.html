<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
</head>
<body>

    <h1>🌤️ Weather Today</h1>

    <h2>Hyderabad</h2>

    <h3>28°C</h3>

    <p>☀️ Sunny</p>

    <hr>

    <h2>Weather Details</h2>

    <ul>
        <li>Humidity: 60%</li>
        <li>Wind Speed: 12 km/h</li>
        <li>Pressure: 1012 hPa</li>

    <table border="1" cellpadding="10">
        <tr>
            <th>Day</th>
            <th>Temperature</th>
            <th>Weather</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>29°C</td>
            <td>☀️ Sunny</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>27°C</td>
            <td>☁️ Cloudy</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>26°C</td>
            <td>🌧️ Rainy</td>
        </tr>
    </table>

</body>
</html>
